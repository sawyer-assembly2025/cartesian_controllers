my_cartesian_motion_controller:
    type: "position_controllers/CartesianMotionController"
    end_effector_link: "right_hand"
    robot_base_link: "right_arm_base_link"
    target_frame_topic: "target_frame"
    joints:
    - right_j0
    - right_j1
    - right_j2
    - right_j3
    - right_j4
    - right_j5
    - right_j6

    pd_gains:
        trans_x: {p: 10.0}
        trans_y: {p: 10.0}
        trans_z: {p: 10.0}
        rot_x: {p: 1.0}
        rot_y: {p: 1.0}
        rot_z: {p: 1.0}

my_cartesian_force_controller:
    type: "position_controllers/CartesianForceController"
    end_effector_link: "right_l6"
    robot_base_link: "right_arm_base_link"
    ft_sensor_ref_link: "right_l6"
    joints:
    - right_j0
    - right_j1
    - right_j2
    - right_j3
    - right_j4
    - right_j5
    - right_j6

    solver:
        error_scale: 0.5

    pd_gains:
        trans_x: {p: 0.05}
        trans_y: {p: 0.05}
        trans_z: {p: 0.05}
        rot_x: {p: 1.5}
        rot_y: {p: 1.5}
        rot_z: {p: 1.5}


my_cartesian_compliance_controller:
    type: "position_controllers/CartesianComplianceController"
    end_effector_link: "right_hand"
    robot_base_link: "right_arm_base_link"
    ft_sensor_ref_link: "right_hand"
    compliance_ref_link: "right_hand"
    target_frame_topic: "target_frame"
    joints:
    - right_j0
    - right_j1
    - right_j2
    - right_j3
    - right_j4
    - right_j5
    - right_j6

    stiffness:  # w.r.t. compliance_ref_link
        trans_x: 500
        trans_y: 500
        trans_z: 500
        rot_x: 20
        rot_y: 20
        rot_z: 20

    solver:
        error_scale: 0.5

    pd_gains:
        trans_x: {p: 0.05}
        trans_y: {p: 0.05}
        trans_z: {p: 0.05}
        rot_x: {p: 1.50}
        rot_y: {p: 1.50}
        rot_z: {p: 1.50}

my_motion_control_handle:
   type: "cartesian_controllers/MotionControlHandle"
   end_effector_link: "right_hand"
   robot_base_link: "right_arm_base_link"
   target_frame_topic: "/my_cartesian_motion_controller/target_frame"
   joints:
    - right_j0
    - right_j1
    - right_j2
    - right_j3
    - right_j4
    - right_j5
    - right_j6

my_joint_to_cartesian_controller:
    type: "cartesian_controllers/JointControllerAdapter"
    end_effector_link: "right_hand"
    robot_base_link: "right_arm_base_link"
    target_frame_topic: "/my_cartesian_motion_controller/target_frame"
    joints:
    - right_j0
    - right_j1
    - right_j2
    - right_j3
    - right_j4
    - right_j5
    - right_j6

    joint_limits:
      right_j0:
        has_velocity_limits: true
        max_velocity: 3.15
        has_acceleration_limits: true
        max_acceleration: 10.0
      right_j1:
        has_velocity_limits: true
        max_velocity: 3.15
        has_acceleration_limits: true
        max_acceleration: 10.0
      right_j2:
        has_velocity_limits: true
        max_velocity: 3.15
        has_acceleration_limits: true
        max_acceleration: 10.0
      right_j3:
        has_velocity_limits: true
        max_velocity: 3.2
        has_acceleration_limits: true
        max_acceleration: 10.0
      right_j4:
        has_velocity_limits: true
        max_velocity: 3.2
        has_acceleration_limits: true
        max_acceleration: 10.0
      right_j5:
        has_velocity_limits: true
        max_velocity: 3.2
        has_acceleration_limits: true
        max_acceleration: 10.0
      right_j6:
        has_velocity_limits: true
        max_velocity: 3.2
        has_acceleration_limits: true
        max_acceleration: 10.0

my_joint_to_cartesian_controller/joint_trajectory_controller:
    type: "position_controllers/JointTrajectoryController"
    joints:
    - right_j0
    - right_j1
    - right_j2
    - right_j3
    - right_j4
    - right_j5
    - right_j6

joint_trajectory_controller:
    type: "position_controllers/JointTrajectoryController"
    joints:
    - right_j0
    - right_j1
    - right_j2
    - right_j3
    - right_j4
    - right_j5
    - right_j6

  # Publish all joint states -----------------------------------

joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 100

  # Sawyer SDK Controllers: Head --------------------------
head_position_controller:
  type: sawyer_sim_controllers/SawyerHeadController
  topic_command: /robot/head/command_head_pan
  topic_state: /robot/head/head_state
  joints:
        head_controller:
          joint: head_pan
          pid: {p: 100.0, i: 1.0, d: 10.0}

  # Sawyer SDK Controllers: Position --------------------------
right_joint_position_controller:
  type: sawyer_sim_controllers/SawyerPositionController
  topic_joint_command: /robot/limb/right/joint_command
  topic_set_speed_ratio: /robot/limb/right/set_speed_ratio
  joints:
    right_j0_controller:
      joint: right_j0
      pid: {p: 500.0,  i: 10.0, d: 25.0}
    right_j1_controller:
      joint: right_j1
      pid: {p: 400.0,  i: 10.0, d: 30.0}
    right_j2_controller:
      joint: right_j2
      pid: {p: 250.0,  i: 10.0, d: 30.0}
    right_j3_controller:
      joint: right_j3
      pid: {p: 300.0,  i: 10.0, d: 50.0}
    right_j4_controller:
      joint: right_j4
      pid: {p: 300.0,  i: 10.0, d: 8.0}
    right_j5_controller:
      joint: right_j5
      pid: {p: 100.0,  i: 1.0, d: 5.0}
    right_j6_controller:
      joint: right_j6
      pid: {p: 50.0,  i: 10.0, d: 4.0}

  # Sawyer SDK Controllers: Velocity --------------------------
right_joint_velocity_controller:
  type: sawyer_sim_controllers/SawyerVelocityController
  topic: /robot/limb/right/joint_command
  joints:
    right_j0_controller:
      joint: right_j0
      pid: {p: 10,  i: 0.0, d: 0.1}
    right_j1_controller:
      joint: right_j1
      pid: {p: 100,  i: 1.0, d: 0.1}
    right_j2_controller:
      joint: right_j2
      pid: {p: 0.05,  i: 0.0, d: 0.01}
    right_j3_controller:
      joint: right_j3
      pid: {p: 0.5,  i: 0.01, d: 0.1}
    right_j4_controller:
      joint: right_j4
      pid: {p: 1.0,  i: 0.0, d: 0.01}
    right_j5_controller:
      joint: right_j5
      pid: {p: 0.05,  i: 0.0, d: 0.01}
    right_j6_controller:
      joint: right_j6
      pid: {p: 0.05,  i: 0.0, d: 0.01}

  # Sawyer SDK Controllers: Effort --------------------------
right_joint_effort_controller:
  type: sawyer_sim_controllers/SawyerEffortController
  topic: /robot/limb/right/joint_command
  joints:
    right_j0_controller:
      joint: right_j0
    right_j1_controller:
      joint: right_j1
    right_j2_controller:
      joint: right_j2
    right_j3_controller:
      joint: right_j3
    right_j4_controller:
      joint: right_j4
    right_j5_controller:
      joint: right_j5
    right_j6_controller:
      joint: right_j6

  # Sawyer SDK Controllers: Gravity Compensation ------------
right_joint_gravity_controller:
  type: sawyer_sim_controllers/SawyerGravityController
  command_topic: /robot/limb/right/gravity_compensation_torques
  disable_topic: /robot/limb/right/suppress_gravity_compensation
  disable_timeout: 0.2
  joints:
    right_j0_controller:
      joint: right_j0
    right_j1_controller:
      joint: right_j1
    right_j2_controller:
      joint: right_j2
    right_j3_controller:
      joint: right_j3
    right_j4_controller:
      joint: right_j4
    right_j5_controller:
      joint: right_j5
    right_j6_controller:
      joint: right_j6
